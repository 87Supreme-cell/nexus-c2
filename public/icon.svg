<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#03070d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="6"/>

  <!-- Tactical Grid Accent Lines -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
  <circle cx="256" cy="256" r="190" stroke="#22c55e" stroke-width="1" stroke-opacity="0.15" fill="none" stroke-dasharray="4 6"/>

  <!-- Tactical Hex Shield Logo -->
  <polygon points="256,120 376,190 376,322 256,392 136,322 136,190" 
           fill="#071324" stroke="url(#cyanGrad)" stroke-width="10" filter="url(#glow)"/>

  <!-- Inner Defense Core -->
  <polygon points="256,155 346,207 346,305 256,357 166,305 166,207" 
           fill="#0a1d35" stroke="url(#greenGrad)" stroke-width="4"/>

  <!-- Radar Reticle Center -->
  <circle cx="256" cy="256" r="45" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="256" r="12" fill="#4ade80" filter="url(#glow)"/>

  <!-- Crosshairs -->
  <line x1="210" y1="256" x2="235" y2="256" stroke="#38bdf8" stroke-width="3"/>
  <line x1="277" y1="256" x2="302" y2="256" stroke="#38bdf8" stroke-width="3"/>
  <line x1="256" y1="210" x2="256" y2="235" stroke="#38bdf8" stroke-width="3"/>
  <line x1="256" y1="277" x2="256" y2="302" stroke="#38bdf8" stroke-width="3"/>
</svg>
